<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
</head>
<body>
    <h2>Contact Us</h2>
    <p>Have a project in mind? Let’s discuss and build something amazing together.</p> <br>
    <form action="">
        <label for="Name">Full Name</label> <br>
        <input type="text"  id="Name" placeholder="Enter your full name"> <br>
        <label for="Email">Email</label>  <br>
        <input type="email" id="Email" placeholder="Enter your email address"> <br>
        <label for="Phone">Mobile Number</label>  <br>
        <input type="tel" id="Phone" placeholder="Enter your mobile number"> <br>
        <label for="service-category">Choose a Service Category:</label> <br>
        <select name="category" id="service-category" required>
        <option value="" disabled selected>-- Select a Service --</option>
        <option value="web-development">Website Design & Development</option>
        <option value="app-development">Mobile App Development</option>
        <option value="digital-marketing">Digital Marketing Services</option>
        <option value="seo-optimization">SEO Optimization Services</option>
        </select><br> <br>
        
        <input type="submit" value="Send Message" id="">
        <input type="reset">

    </form>
    
</body>
</html>
